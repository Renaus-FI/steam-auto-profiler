name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck, py_compile, and unit tests
        run: |
          mapfile -t shell_scripts < <(
            grep -lE '^#!(/(usr/)?bin/(env[[:space:]]+)?(ba|da)?sh)\b' bin/* install.sh
          )
          shellcheck "${shell_scripts[@]}"
          python3 -m py_compile bin/steam-auto-sync bin/steam-auto-ui tests/*.py
          python3 -m unittest discover -s tests -v
