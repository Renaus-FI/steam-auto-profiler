name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck and unit tests
        run: |
          shellcheck $(find bin -maxdepth 1 -type f ! -name steam-auto-sync -print) install.sh
          python3 -m unittest discover -s tests -v
